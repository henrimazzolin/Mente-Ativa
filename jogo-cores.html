<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="reconhecimento de cores - Mente Ativa">
    <title>Mente Ativa - Reconhecimento de Cores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/jogo-cores.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/assistente-flutuante.css">
    <link rel="shortcut icon" href="img/unnamed.jpg" type="image/x-icon">
    <script src="js/accessibility-unified.js" defer></script>
    <script src="js/components/logo.js" defer></script>

    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="modo-dependente">
    <div class="header">
        <button class="back-btn" id="btn-back">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
        </button>
        <div class="logo" data-logo-tipo="simples">
            <div class="logo-icon">
                <img alt="Logo">
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="game-card">
            <h1 class="game-title">Reconhecimento de Cores</h1>

            <div class="instruction-box">
                <p class="instruction-text">Clique na cor que aparece abaixo!</p>
            </div>

            <div class="color-display">
                <div id="colorCircle" class="color-circle"></div>
            </div>

            <div class="options-container" id="optionsContainer"></div>

            <button class="next-btn" id="nextBtn">Próxima</button>

            <div class="score-display">
                <div class="score-item">
                    <div class="score-label">Acertos</div>
                    <div class="score-value" id="acertos">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Questão</div>
                    <div class="score-value" id="questao">1/5</div>
                </div>
            </div>
        </div>
    </div>

    <div class="feedback-overlay" id="feedbackOverlay">
        <div class="feedback-card">
            <div class="feedback-icon" id="feedbackIcon"></div>
            <h2 class="feedback-title" id="feedbackTitle"></h2>
            <p class="feedback-subtitle" id="feedbackSubtitle"></p>
            <button class="btn" id="feedbackBtn">Continuar</button>
        </div>
    </div>

    <footer>
        <p>Cuidar da mente é cultivar a vida.</p>
        <p>&copy; 2025 Mente Ativa. Todos os direitos reservados.</p>
            <a href="sobre.html" class="sobre-footer">Sobre</a>
    </footer>

    <script src="js/jogo-cores.js"></script>
    <script src="js/assistente-flutuante.js"></script>
    <script src="js/alerts.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>
