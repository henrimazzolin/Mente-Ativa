<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pintura simples acompanhada - Mente Ativa">
    <title>Mente Ativa - Pintura Simples</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/jogo-pintura-simples.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/assistente-flutuante.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/accessibility-unified.js" defer></script>
    <script src="js/components/logo.js" defer></script>
</head>
<body>
    <div class="container simple-paint-page">
        <header class="header">
            <a href="jogos-acompanhados.html" class="back-btn" aria-label="Voltar aos jogos acompanhados"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></a>
            <div class="logo" data-logo-tipo="simples"><div class="logo-icon"><img alt="Logo Mente Ativa"></div></div>
        </header>
        <main class="simple-paint-card">
            <h1>Pintura Simples</h1>
            <p class="simple-instruction">Escolha uma cor e arraste o dedo na tela.</p>
            <div class="simple-colors" id="simpleColors" aria-label="Escolha uma cor"></div>
            <div class="simple-paint-tools">
                <button type="button" id="simpleBrush" class="active" aria-pressed="true">🖌️ Pintar</button>
                <button type="button" id="simpleEraser" aria-pressed="false">▭ Borracha</button>
                <button type="button" id="simpleClear">Limpar</button>
            </div>
            <div class="simple-canvas-wrap"><canvas id="simplePaintCanvas" width="900" height="650" aria-label="Área de pintura" tabindex="0"></canvas></div>
            <p id="simplePaintStatus" aria-live="polite">Cor azul selecionada.</p>
        </main>
    </div>
    <script src="js/alerts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/jogo-pintura-simples.js"></script>
    <script src="js/assistente-flutuante.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
