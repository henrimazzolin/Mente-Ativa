<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="damas - Mente Ativa">
    <title>Mente Ativa - Damas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="img/unnamed.jpg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/jogo-damas.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/assistente-flutuante.css">
    <script src="js/accessibility-unified.js" defer></script>
    <script src="js/components/logo.js" defer></script>

    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="jogos-individuais.html" class="back-btn"><svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
            </svg>
            </a>
            <div class="logo" data-logo-tipo="moderado">
                <div class="logo-icon"><img alt="Logo Mente Ativa" /></div>
            </div>
        </div>
        <div class="page-title">
            <h1>Damas</h1>
            <p>Jogue uma partida de damas</p>
        </div>

        <div id="game-screen">
            <div id="fundo"></div>
            <div class="game-layout">
                <div class="board-section">
                    <div id="game-status" aria-live="polite" aria-atomic="true">
                        <span id="status-text"></span>
                    </div>
                    <div class="board-area">
                        <div id="tabuleiro" role="grid" aria-label="Tabuleiro de damas">
                            <div id="t00" role="gridcell"></div><div id="t01" role="gridcell"></div>
                            <div id="t02" role="gridcell"></div><div id="t03" role="gridcell"></div>
                            <div id="t04" role="gridcell"></div><div id="t05" role="gridcell"></div>
                            <div id="t06" role="gridcell"></div><div id="t07" role="gridcell"></div>

                            <div id="t10" role="gridcell"></div><div id="t11" role="gridcell"></div>
                            <div id="t12" role="gridcell"></div><div id="t13" role="gridcell"></div>
                            <div id="t14" role="gridcell"></div><div id="t15" role="gridcell"></div>
                            <div id="t16" role="gridcell"></div><div id="t17" role="gridcell"></div>

                            <div id="t20" role="gridcell"></div><div id="t21" role="gridcell"></div>
                            <div id="t22" role="gridcell"></div><div id="t23" role="gridcell"></div>
                            <div id="t24" role="gridcell"></div><div id="t25" role="gridcell"></div>
                            <div id="t26" role="gridcell"></div><div id="t27" role="gridcell"></div>

                            <div id="t30" role="gridcell"></div><div id="t31" role="gridcell"></div>
                            <div id="t32" role="gridcell"></div><div id="t33" role="gridcell"></div>
                            <div id="t34" role="gridcell"></div><div id="t35" role="gridcell"></div>
                            <div id="t36" role="gridcell"></div><div id="t37" role="gridcell"></div>

                            <div id="t40" role="gridcell"></div><div id="t41" role="gridcell"></div>
                            <div id="t42" role="gridcell"></div><div id="t43" role="gridcell"></div>
                            <div id="t44" role="gridcell"></div><div id="t45" role="gridcell"></div>
                            <div id="t46" role="gridcell"></div><div id="t47" role="gridcell"></div>

                            <div id="t50" role="gridcell"></div><div id="t51" role="gridcell"></div>
                            <div id="t52" role="gridcell"></div><div id="t53" role="gridcell"></div>
                            <div id="t54" role="gridcell"></div><div id="t55" role="gridcell"></div>
                            <div id="t56" role="gridcell"></div><div id="t57" role="gridcell"></div>

                            <div id="t60" role="gridcell"></div><div id="t61" role="gridcell"></div>
                            <div id="t62" role="gridcell"></div><div id="t63" role="gridcell"></div>
                            <div id="t64" role="gridcell"></div><div id="t65" role="gridcell"></div>
                            <div id="t66" role="gridcell"></div><div id="t67" role="gridcell"></div>

                            <div id="t70" role="gridcell"></div><div id="t71" role="gridcell"></div>
                            <div id="t72" role="gridcell"></div><div id="t73" role="gridcell"></div>
                            <div id="t74" role="gridcell"></div><div id="t75" role="gridcell"></div>
                            <div id="t76" role="gridcell"></div><div id="t77" role="gridcell"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="escolhecor-inicio" class="visible" style="display: flex;">
        <a href="jogos-individuais.html" class="back-btn-escolha">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </a>
        <div class="escolha-lado-container">
            <div class="escolha-lado-titulo"><span class="title-icon">&#9898;</span> ESCOLHA SEU LADO</div>
            <p class="escolha-subtitulo">Você jogará contra o robô. As peças brancas sempre começam a partida.</p>
            <div class="color-choice-container">
                <div class="color-option" id="color-white">
                    <div class="checkers-piece white"></div>
                    <div class="color-label">BRANCO</div>
                </div>
                <div class="color-option" id="color-black">
                    <div class="checkers-piece black"></div>
                    <div class="color-label">PRETO</div>
                </div>
            </div>
        </div>
    </div>

    <div id="game-over-modal">
        <div class="game-over-content">
            <div class="game-over-emoji" id="game-over-emoji">&#x1F3C6;</div>
            <h2 class="game-over-title" id="game-over-title">Você Ganhou!</h2>
            <p class="game-over-message" id="game-over-message">Parabéns!</p>
            <button class="btn" id="btn-reload">Jogar Novamente</button>
        </div>
    </div>

    <footer>
        <p>Cuidar da mente é cultivar a vida.</p>
        <p>&copy; 2025 Mente Ativa. Todos os direitos reservados.</p>
            <a href="sobre.html" class="sobre-footer">Sobre</a>
    </footer>

    <script src="js/lib/damas-engine.js"></script>
    <script src="js/jogo-damas.js"></script>
    <script src="js/assistente-flutuante.js"></script>
    <script src="js/alerts.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script>if('serviceWorker'in navigator){navigator.serviceWorker.register('service-worker.js').catch(function(){})}</script>
</body>
</html>
