<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jogo da memória - Mente Ativa">
    <title>Mente Ativa - Jogo da Memória</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="js/lib/utils.js" defer></script>
    <script src="js/accessibility-unified.js" defer></script>
    <link rel="shortcut icon" href="img/unnamed.jpg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/jogo-memoria.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/assistente-flutuante.css">
    <link rel="stylesheet" href="css/dificuldade.css">
    <script src="js/components/logo.js" defer></script>

    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="jogos-individuais.html" class="back-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </a>
            <div class="logo" data-logo-tipo="moderado">
                <div class="logo-icon">
                    <img alt="Logo Mente Ativa" />
                </div>
            </div>
        </div>

        <div class="page-title">
            <div class="titulo-com-tts">
                <h1>Jogo da Memória</h1>

            </div>
            <p>Encontre os pares de cartas iguais</p>
        </div>

        <div class="dificuldade-selector">
            <span class="dificuldade-label">Dificuldade:</span>
            <button class="dif-btn facil active">Fácil</button>
            <button class="dif-btn medio">Médio</button>
            <button class="dif-btn dificil">Difícil</button>
        </div>

        <div class="game-info">
            <div class="info-item">
                <div class="info-label">Pares encontrados</div>
                <div class="info-value" id="pairs">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">Tentativas</div>
                <div class="info-value" id="attempts">0</div>
            </div>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="buttons">
            <button class="btn" id="btn-restart">Reiniciar Jogo</button>
            <button class="btn btn-secondary" id="btn-back">Voltar</button>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="feedback" id="feedback">
        <div class="feedback-icon" id="feedbackIcon"></div>
        <h2 id="feedbackTitle">Muito bem!</h2>
        <p id="feedbackText">Você encontrou um par!</p>
        <button class="btn" id="feedbackBtn">Continuar</button>
    </div>

    <footer>
        <p>Cuidar da mente é cultivar a vida.</p>
        <p>&copy; 2025 Mente Ativa. Todos os direitos reservados.</p>
            <a href="sobre.html" class="sobre-footer">Sobre</a>
    </footer>

    <script src="js/jogo-memoria.js"></script>
    <script src="js/assistente-flutuante.js"></script>
    <script src="js/alerts.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>
