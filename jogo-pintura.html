<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jogo de pintura para idosos - Mente Ativa">
    <title>Mente Ativa - Pintura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/jogo-pintura.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="shortcut icon" href="/TCC---Idosos/img/unnamed.jpg" type="image/x-icon">
    <script src="js/acessibilidade.js" defer></script>
    <script src="js/dark-mode.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="grupo-moderado.html" class="back-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </a>
            <div class="logo">
                <div class="logo-icon">
                    <img src="img/LogoAzul.png" alt="Logo Mente Ativa" />
                </div>
            </div>
        </div>

        <div class="page-title">
            <h1>Pintura</h1>
            <p>Desenhe livremente na tela virtual</p>
        </div>

        <div class="instrucao-destaque">
            <p>Escolha uma cor, selecione o tamanho do pincel e desenhe livremente na tela. Use a borracha para apagar e o botão limpar para recomeçar.</p>
        </div>

        <div class="game-container">
            <div class="paint-tools">
                <div class="tool-section">
                    <div class="tool-label">Cores:</div>
                    <div class="colors-palette" id="colorsPalette"></div>
                </div>

                <div class="tool-section">
                    <div class="tool-label">Tamanho do Pincel:</div>
                    <div class="brush-sizes">
                        <button class="brush-size-btn active" data-size="3">P</button>
                        <button class="brush-size-btn" data-size="8">M</button>
                        <button class="brush-size-btn" data-size="15">G</button>
                    </div>
                </div>

                <div class="tool-section">
                    <button class="tool-btn" id="btn-eraser">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path d="M15.14 3c-.39 0-.78.15-1.07.44L2.29 15.29c-.59.59-.59 1.54 0 2.12l3.29 3.29c.59.59 1.54.59 2.12 0L16.86 8.56c.29-.29.44-.68.44-1.07V4c0-.55-.45-1-1-1h-1.72zM7 18c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" fill="currentColor"/>
                        </svg>
                        Borracha
                    </button>
                    <button class="tool-btn btn-clear" id="btn-clear">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/>
                        </svg>
                        Limpar Tudo
                    </button>
                    <button class="tool-btn btn-save" id="btn-save">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z" fill="currentColor"/>
                        </svg>
                        Salvar
                    </button>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="paintCanvas" width="800" height="500"></canvas>
            </div>
        </div>
    </div>

    <footer>
        <p>Feito com cuidado para você</p>
    </footer>

    <script src="js/jogo-pintura.js"></script>
</body>
</html>
