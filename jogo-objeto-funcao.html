<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ligação de imagens - Mente Ativa">
    <title>Mente Ativa - Ligue as Imagens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="js/components/accessibility.js" defer></script>
    <link rel="shortcut icon" href="img/unnamed.jpg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/jogo-objeto-funcao.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/assistente-flutuante.css">
    <link rel="stylesheet" href="css/dificuldade.css">
    <script src="js/dark-mode.js" defer></script>
    <script src="js/components/logo.js" defer></script>

    
</head>
<body>
    <div class="header">
        <button class="back-btn" id="btn-back">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
        </button>
        <div class="logo" data-logo-tipo="simples">
            <div class="logo-icon">
                <img alt="Logo">
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="game-card">
            <h1 class="game-title">Ligue as Imagens</h1>

            <div class="instruction-box">
                <p class="instruction-text">Toque em uma imagem da esquerda</p>
                <p class="instruction-sub">Depois toque na imagem igual na direita</p>
            </div>

            <div class="dificuldade-selector">
                <span class="dificuldade-label">Dificuldade:</span>
                <button class="dif-btn facil active">Fácil</button>
                <button class="dif-btn medio">Médio</button>
                <button class="dif-btn dificil">Difícil</button>
            </div>

            <div class="game-area" id="gameArea">
                <div class="column" id="leftColumn">
                    <p class="column-title">Toque primeiro aqui</p>
                </div>
                <div class="column" id="rightColumn">
                    <p class="column-title">Depois toque aqui</p>
                </div>
            </div>

            <div class="score-display">
                <div class="score-item">
                    <div class="score-label">Acertos</div>
                    <div class="score-value" id="acertos">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Falta</div>
                    <div class="score-value" id="falta">3</div>
                </div>
            </div>

            <button class="btn" id="btn-restart">Jogar Novamente</button>
        </div>
    </div>

    <div class="feedback-overlay" id="feedbackOverlay">
        <div class="feedback-card">
            <div class="feedback-icon" id="feedbackIcon"></div>
            <h2 class="feedback-title" id="feedbackTitle"></h2>
            <p class="feedback-subtitle" id="feedbackSubtitle"></p>
            <button class="btn" id="feedbackBtn">Continuar</button>
        </div>
    </div>

    <footer>
        <p>Cuidar da mente é cultivar a vida.</p>
        <p>&copy; 2025 Mente Ativa. Todos os direitos reservados.</p>
            <a href="sobre.html" class="sobre-footer">Sobre</a>
    </footer>

    <script src="js/jogo-objeto-funcao.js"></script>
    <script src="js/assistente-flutuante.js"></script>
    <script src="js/alerts.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
