<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Playlist de músicas acompanhada - Mente Ativa">
    <title>Mente Ativa - Música</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="img/unnamed.jpg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/jogo-musica.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/assistente-flutuante.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/accessibility-unified.js" defer></script>
    <script src="js/components/logo.js" defer></script>
</head>
<body class="modo-dependente">
    <div class="container music-page">
        <header class="header">
            <a href="jogos-acompanhados.html" class="back-btn" aria-label="Voltar aos jogos acompanhados">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </a>
            <div class="logo" data-logo-tipo="simples"><div class="logo-icon"><img alt="Logo Mente Ativa"></div></div>
        </header>

        <main class="music-shell" aria-labelledby="musicTitle">
            <section class="music-hero">
                <div class="music-hero-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h6V3h-8Z"/></svg>
                </div>
                <div>
                    <span class="music-kicker">Ouça no seu ritmo</span>
                    <h1 id="musicTitle">Músicas</h1>
                    <p>Escolha uma faixa da lista para tocar.</p>
                </div>
            </section>

            <section class="playlist-section" aria-labelledby="playlistTitle">
                <div class="playlist-heading">
                    <div><span>Playlist</span><h2 id="playlistTitle">Músicas nostálgicas</h2></div>
                    <strong id="playlistCount">37 faixas</strong>
                </div>
                <div class="playlist" id="playlist"></div>
            </section>
        </main>
    </div>

    <footer>
        <p>Cuidar da mente é cultivar a vida.</p>
        <p>&copy; 2025 Mente Ativa. Todos os direitos reservados.</p>
        <a href="sobre.html" class="sobre-footer">Sobre</a>
    </footer>

    <script src="js/jogo-musica.js"></script>
    <script src="js/assistente-flutuante.js"></script>
    <script src="js/alerts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
