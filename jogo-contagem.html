<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="jogo de contagem - Mente Ativa">
    <title>Mente Ativa - Contagem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/jogo-contagem.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/assistente-flutuante.css">
    <link rel="shortcut icon" href="img/unnamed.jpg" type="image/x-icon">
    <script src="js/lib/utils.js" defer></script>
    <script src="js/accessibility-unified.js" defer></script>
    <script src="js/components/logo.js" defer></script>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="container">
        <div class="header">
        <a href="jogos-acompanhados.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </a>
        <div class="logo" data-logo-tipo="simples">
            <div class="logo-icon">
                <img alt="Logo">
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="game-card">
            <h1 class="game-title">Contagem</h1>

            <div class="instruction-box">
                <p class="instruction-text">Quantos têm?</p>
            </div>

            <div class="game-area" id="gameArea">
                <div class="count-display" id="countDisplay"></div>
                <div class="options-container" id="optionsContainer"></div>
            </div>

            <div class="feedback-area" id="feedbackArea">
                <div class="feedback-icon" id="feedbackIcon"></div>
                <div class="feedback-text" id="feedbackText"></div>
            </div>

            <button class="next-btn" id="nextBtn">Próximo</button>

            <div class="score-display">
                <span id="scoreDisplay">0 acertos</span>
            </div>
        </div>
    </div>
</div>

    <footer>
        <p>Cuidar da mente é cultivar a vida.</p>
        <p>&copy; 2025 Mente Ativa. Todos os direitos reservados.</p>
        <a href="sobre.html" class="sobre-footer">Sobre</a>
    </footer>

    <script src="js/jogo-contagem.js"></script>
    <script src="js/assistente-flutuante.js"></script>
    <script src="js/alerts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>
